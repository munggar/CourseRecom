name: CourseRecom checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CourseRecomV2/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: CourseRecomV2/backend/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ind
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CourseRecomV2/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CourseRecomV2/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CourseRecomV2/frontend/package-lock.json
      - name: Install backend dependencies and Playwright
        run: |
          python -m pip install -r CourseRecomV2/backend/requirements.txt
          python -m pip install playwright
      - name: Install frontend dependencies
        working-directory: CourseRecomV2/frontend
        run: npm ci
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser E2E smoke journey
        run: python CourseRecomV2/e2e/run_browser_smoke.py

  submission-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and inspect clean submission archive
        run: |
          python -m py_compile scripts/build_submission_zip.py
          python scripts/build_submission_zip.py --output "$RUNNER_TEMP/CourseRecom-submission.zip"
          OUTPUT_ZIP="$RUNNER_TEMP/CourseRecom-submission.zip" python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          archive = Path(os.environ["OUTPUT_ZIP"])
          with zipfile.ZipFile(archive) as package:
              names = package.namelist()
              assert names, "Submission archive is empty."
              forbidden = ("/.git/", "/.venv/", "/node_modules/", "/__pycache__/", "/.env")
              assert not any(any(part in name for part in forbidden) for name in names), "Archive includes excluded artifacts."
          print(f"Validated {len(names)} packaged source files.")
          PY
