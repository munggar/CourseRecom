name: CourseRecom isolated audit

on:
  push:
    branches:
      - audit/course-recom-validation-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (isolated SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CourseRecomV2/backend
    env:
      ENVIRONMENT: testing
      DATABASE_URL: sqlite:///./courserecom-audit-ci.db
      SEED_DEMO_USERS: "true"
      JWT_SECRET: courserecom-ci-jwt-secret-not-used-in-production-2026
      QR_VERIFICATION_SECRET: courserecom-ci-qr-secret-not-used-in-production-2026
      FRONTEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CourseRecomV2/backend/requirements.txt
      - name: Install system OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ind
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Run backend regression and demo-account tests
        run: python -m pytest -q --tb=short --junitxml=pytest-report.xml
      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courserecom-backend-test-report
          path: CourseRecomV2/backend/pytest-report.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CourseRecomV2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: CourseRecomV2/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build production frontend
        run: npm run build
